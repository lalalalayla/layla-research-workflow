name: email-digest

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 00:00 UTC = 北京时间 08:00
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone output repo
        env:
          TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/lalalalayla/layla-research-output.git" output
          git -C output config user.name "github-actions[bot]"
          git -C output config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch email alerts digest
        env:
          RESEARCH_OUTPUT_ROOT: ${{ github.workspace }}/output
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/fetch_email_digest.py --days 7

      - name: Commit and push outputs
        env:
          TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
        run: |
          cd output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: email alerts digest $(date +%Y-W%V)" || true
          git push "https://x-access-token:${TOKEN}@github.com/lalalalayla/layla-research-output.git" HEAD:main
